name: release

on:
  push:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 ─────────────────────────────────────────────────────
          - target:    x86_64-unknown-linux-musl
            os:        ubuntu-latest
            platform:  linux/amd64
            bundle:    true

          # ── Linux ARM64 ───────────────────────────────────────────────────────
          - target:    aarch64-unknown-linux-musl
            os:        ubuntu-24.04-arm
            platform:  linux/arm64
            bundle:    true

          # ── Linux ARMv7 — cross (ring needs ARM toolchain; tools via PATH) ────
          - target:    armv7-unknown-linux-musleabihf
            os:        ubuntu-latest
            use_cross: true

          # ── macOS Intel ───────────────────────────────────────────────────────
          - target: x86_64-apple-darwin
            os:     macos-13

          # ── macOS Apple Silicon ───────────────────────────────────────────────
          - target: aarch64-apple-darwin
            os:     macos-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release tag
        run: echo "TAG=v$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux native)
        if: runner.os == 'Linux' && !matrix.use_cross
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools

      - name: Install cross (ARMv7)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      # ── Bundle tool binaries (x86_64 and aarch64 Linux only) ──────────────
      - name: Bundle tools
        if: matrix.bundle
        run: |
          chmod +x ci/bundle-tools.sh
          ci/bundle-tools.sh "${{ matrix.platform }}" "$PWD/bundled-tools"
          echo "WIFL_WIMLIB_IMAGEX=$PWD/bundled-tools/wimlib-imagex" >> "$GITHUB_ENV"
          echo "WIFL_SFDISK=$PWD/bundled-tools/sfdisk"               >> "$GITHUB_ENV"
          echo "WIFL_MKNTFS=$PWD/bundled-tools/mkntfs"               >> "$GITHUB_ENV"
          echo "WIFL_MKFS_FAT=$PWD/bundled-tools/mkfs.fat"           >> "$GITHUB_ENV"
          echo "WIFL_PARTPROBE=$PWD/bundled-tools/partprobe"         >> "$GITHUB_ENV"
          echo "WIFL_EFIBOOTMGR=$PWD/bundled-tools/efibootmgr"       >> "$GITHUB_ENV"
          echo "WIFL_LSBLK=$PWD/bundled-tools/lsblk"                 >> "$GITHUB_ENV"
          echo "WIFL_FUSER=$PWD/bundled-tools/fuser"                  >> "$GITHUB_ENV"

      # ── Cache cargo registry ───────────────────────────────────────────────
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      # ── Package ───────────────────────────────────────────────────────────
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/wifl dist/wifl-${{ matrix.target }}

      # ── Release ───────────────────────────────────────────────────────────
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ env.TAG }}
          name:       ${{ env.TAG }}
          files:      dist/*
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
