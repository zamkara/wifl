name: release

on:
  push:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 ─────────────────────────────────────────────────────
          - target:   x86_64-unknown-linux-musl
            os:       ubuntu-latest
            platform: linux/amd64
            wimlib:   https://wimlib.net/downloads/wimlib-1.14.4-x86_64-linux-bin.tar.gz

          # ── Linux ARM64 ───────────────────────────────────────────────────────
          - target:   aarch64-unknown-linux-musl
            os:       ubuntu-24.04-arm
            platform: linux/arm64
            wimlib:   ""   # pulled from Alpine

          # ── Linux ARMv7 ───────────────────────────────────────────────────────
          - target:   armv7-unknown-linux-musleabihf
            os:       ubuntu-latest
            platform: linux/arm/v7
            wimlib:   ""
            qemu:     true

          # ── macOS Intel ───────────────────────────────────────────────────────
          - target: x86_64-apple-darwin
            os:     macos-13

          # ── macOS Apple Silicon ───────────────────────────────────────────────
          - target: aarch64-apple-darwin
            os:     macos-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release tag
        run: echo "TAG=v$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools

      - name: Set up QEMU (ARMv7)
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3

      # ── Bundle tool binaries (Linux only) ──────────────────────────────────
      - name: Bundle tools
        if: runner.os == 'Linux'
        run: |
          chmod +x ci/bundle-tools.sh
          ci/bundle-tools.sh "${{ matrix.platform }}" "${{ matrix.wimlib }}" "$PWD/bundled-tools"
          echo "WIFL_WIMLIB_IMAGEX=$PWD/bundled-tools/wimlib-imagex" >> "$GITHUB_ENV"
          echo "WIFL_SGDISK=$PWD/bundled-tools/sgdisk"               >> "$GITHUB_ENV"
          echo "WIFL_MKNTFS=$PWD/bundled-tools/mkntfs"               >> "$GITHUB_ENV"
          echo "WIFL_MKFS_FAT=$PWD/bundled-tools/mkfs.fat"           >> "$GITHUB_ENV"
          echo "WIFL_PARTPROBE=$PWD/bundled-tools/partprobe"         >> "$GITHUB_ENV"
          echo "WIFL_EFIBOOTMGR=$PWD/bundled-tools/efibootmgr"       >> "$GITHUB_ENV"
          echo "WIFL_LSBLK=$PWD/bundled-tools/lsblk"                 >> "$GITHUB_ENV"
          echo "WIFL_FUSER=$PWD/bundled-tools/fuser"                  >> "$GITHUB_ENV"

      # ── Cache cargo registry ───────────────────────────────────────────────
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # ── Package ───────────────────────────────────────────────────────────
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/wifl dist/wifl-${{ matrix.target }}

      # ── Release ───────────────────────────────────────────────────────────
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ env.TAG }}
          name:       ${{ env.TAG }}
          files:      dist/*
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
