name: release

on:
  push:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os:     ubuntu-latest
            docker: linux/amd64

          - target: aarch64-unknown-linux-musl
            os:     ubuntu-24.04-arm
            docker: linux/arm64

          # armv7: QEMU collects arm/v7 Alpine tools; zig cross-compiles Rust
          - target:   armv7-unknown-linux-musleabihf
            os:       ubuntu-latest
            docker:   linux/arm/v7
            use_zig:  true

          - target: x86_64-apple-darwin
            os:     macos-latest

          - target: aarch64-apple-darwin
            os:     macos-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release tag
        run: echo "TAG=v$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux' && !matrix.use_zig
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools

      - name: Set up QEMU
        if: matrix.docker != '' && matrix.use_zig
        uses: docker/setup-qemu-action@v3

      # ── Bundle tool binaries from Alpine ──────────────────────────────────
      - name: Bundle tools
        if: matrix.docker != ''
        run: |
          chmod +x ci/bundle-tools.sh
          ci/bundle-tools.sh "${{ matrix.docker }}" "$PWD/bundled-tools"
          echo "WIFL_WIMLIB_IMAGEX=$PWD/bundled-tools/wimlib-imagex" >> "$GITHUB_ENV"
          echo "WIFL_SFDISK=$PWD/bundled-tools/sfdisk"               >> "$GITHUB_ENV"
          echo "WIFL_MKNTFS=$PWD/bundled-tools/mkntfs"               >> "$GITHUB_ENV"
          echo "WIFL_PARTPROBE=$PWD/bundled-tools/partprobe"         >> "$GITHUB_ENV"
          echo "WIFL_EFIBOOTMGR=$PWD/bundled-tools/efibootmgr"       >> "$GITHUB_ENV"
          echo "WIFL_LSBLK=$PWD/bundled-tools/lsblk"                 >> "$GITHUB_ENV"
          echo "WIFL_FUSER=$PWD/bundled-tools/fuser"                  >> "$GITHUB_ENV"
          echo "WIFL_UEFI_NTFS=$PWD/res/uefi-ntfs.img"              >> "$GITHUB_ENV"

      - name: Install zig + cargo-zigbuild
        if: matrix.use_zig
        run: |
          pip install ziglang --quiet
          cargo install cargo-zigbuild --quiet 2>&1 | tail -1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build
        run: |
          if [ "${{ matrix.use_zig }}" = "true" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/wifl dist/wifl-${{ matrix.target }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ env.TAG }}
          name:       ${{ env.TAG }}
          files:      dist/*
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
